:root {
  --coral: #e4573d;
  --indigo: #2c3a8c;
  --bg: #f1eadd;
  --surface: #faf6ee;
  --ink: #1f1c27;
  --muted: #6b6455;
  --line: #ddd2bf;
  --accent: #c8422a;
  --accent-ink: #fff9f0;
  --focus: #2c3a8c;
  --shadow: 0 1px 0 rgb(31 28 39 / .06), 0 18px 40px -18px rgb(60 40 20 / .35);
  --wood: #b9854f;
  --wood-line: #4b2f17;
  --serif: 'Instrument Serif', 'Noto Serif TC', 'Songti TC', 'PMingLiU', Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg: #13111b;
  --surface: #1c1927;
  --ink: #f1ebdf;
  --muted: #a39d92;
  --line: #322e42;
  --accent: #ff7a5c;
  --accent-ink: #1a0f0a;
  --focus: #9fb0ff;
  --coral: #ff7a5c;
  --indigo: #8f9dff;
  --shadow: 0 1px 0 rgb(255 255 255 / .05), 0 24px 48px -20px rgb(0 0 0 / .7);
  --wood: #d9a56a;
  --wood-line: #3b2312;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme='auto'] {
    --bg: #13111b;
    --surface: #1c1927;
    --ink: #f1ebdf;
    --muted: #a39d92;
    --line: #322e42;
    --accent: #ff7a5c;
    --accent-ink: #1a0f0a;
    --focus: #9fb0ff;
    --coral: #ff7a5c;
    --indigo: #8f9dff;
    --shadow: 0 1px 0 rgb(255 255 255 / .05), 0 24px 48px -20px rgb(0 0 0 / .7);
    --wood: #d9a56a;
    --wood-line: #3b2312;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.skip { position: absolute; left: 12px; top: -48px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 10; }
.skip:focus { top: 12px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1120px; margin: 0 auto; padding: 18px 20px 0; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font: 400 28px/1 var(--serif); letter-spacing: .2px; }
.mark { width: 28px; height: 28px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); text-decoration: none; transition: color .15s, border-color .15s, background .15s; }
.chip:hover { color: var(--ink); border-color: var(--muted); }

main { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.intro { padding: 36px 0 22px; max-width: 720px; }
h1 { margin: 0; font: 400 clamp(32px, 7vw, 64px)/1.1 var(--serif); letter-spacing: -.5px; }
.intro p { margin: 14px 0 0; color: var(--muted); font-size: 17px; max-width: 56ch; text-wrap: pretty; }

.layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); padding-bottom: 28px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 48px; align-items: start; }
  .stage { position: sticky; top: 20px; }
}

.frame { position: relative; border-radius: 4px; background: var(--cloth, #f5eee3); box-shadow: var(--shadow); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: background .3s; }
.poster, .poster svg { display: block; width: 100%; height: auto; }
.poster.swap svg { animation: settle .35s var(--ease); }
@keyframes settle { from { opacity: 0; transform: translateY(6px); } }
.poster.weaving .row { animation: row-in .55s var(--ease) both; animation-delay: calc(var(--i) * 11ms); }
@keyframes row-in { from { opacity: 0; transform: translateX(-34px); } }

.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dim { fill: var(--cloth, #f5eee3); opacity: 0; transition: opacity .18s; }
.frame.scrub .dim { opacity: .62; }
.band { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; transition: x .16s var(--ease), y .16s var(--ease), width .16s var(--ease), height .16s var(--ease); }
.frame.dragging .band, .frame.dragging .shuttle { transition: none; }

.shuttle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: grab; display: grid; place-items: center; transition: top .16s var(--ease), left .16s var(--ease); z-index: 2; }
.shuttle:active, .frame.dragging .shuttle { cursor: grabbing; }
.boat { width: 30px; height: 15px; filter: drop-shadow(0 2px 2px rgb(0 0 0 / .35)); transition: transform .15s var(--ease); }
.frame.scrub .boat { transform: scale(1.25); }

.badge { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: var(--ink); color: var(--bg); opacity: .85; pointer-events: none; }

.readout { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.readout p { flex: 1; margin: 0; text-align: center; font-variant-numeric: tabular-nums; min-height: 1.55em; }
.step { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 26px; line-height: 1; display: grid; place-items: center; padding: 0 0 3px; transition: transform .12s var(--ease), border-color .15s; }
.step:hover { border-color: var(--muted); }
.step:active { transform: scale(.92); }

/* On a phone the picture stays pinned while the controls scroll beneath it. */
@media (max-width: 899px) and (min-height: 620px) {
  .stage { position: sticky; top: 0; z-index: 4; margin: 0 -20px; padding: 8px 20px 10px; background: var(--bg); }
  .stage .frame { width: min(100%, 41.6vh); margin-inline: auto; }
  html { scroll-padding-top: calc(41.6vh * 1.25 + 90px); }
}

.panel { display: grid; gap: 14px; }
.block { margin: 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
.block legend { padding: 0 6px; margin-left: -6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.source { transition: border-color .15s, background .15s; }
.source.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; text-decoration: none; transition: transform .12s var(--ease), background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn.wide { flex: 1; }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.links { margin: 6px 0 0; font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
.links a, .linklike { color: var(--indigo); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: color-mix(in srgb, var(--indigo) 9%, transparent); }
.status.error { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.status ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; min-height: 44px; padding: 0 16px; transition: background .15s, color .15s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked='true'] { background: var(--ink); color: var(--bg); }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.field.inline { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.field input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; color: var(--ink); width: 100%; min-width: 0; }
.field.inline input { width: auto; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin-top: 12px; }
.names .field:first-of-type { margin-bottom: 0; }

.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { position: relative; width: 76px; height: 52px; border-radius: 10px; border: 2px solid var(--line); padding: 0; overflow: hidden; background: var(--g); transition: transform .15s var(--ease), border-color .15s, box-shadow .15s; }
.swatch::before, .swatch::after { content: ''; position: absolute; border-radius: 1px; }
.swatch::before { left: 6px; right: 6px; top: 18px; height: 14px; background: var(--a); }
.swatch::after { top: 6px; bottom: 6px; left: 31px; width: 14px; background: var(--b); box-shadow: 0 0 0 2px var(--g); }
.swatch[aria-checked='true'] { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 14px -8px rgb(0 0 0 / .45); }

.save { display: flex; gap: 10px; flex-wrap: wrap; }
.foot { max-width: 1120px; margin: 0 auto; padding: 8px 20px 48px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.foot p { margin: 0; max-width: 72ch; }

@media (max-width: 520px) {
  .pair { grid-template-columns: 1fr 1fr; }
  .pair .btn { grid-column: 1 / -1; order: 3; }
  .tools .chip { padding: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="top">
  <a class="brand" href="#" aria-label="ChitWeave">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="7" width="28" height="6" rx="1" fill="var(--coral)"/>
      <rect x="2" y="19" width="28" height="6" rx="1" fill="var(--coral)"/>
      <rect x="7" y="2" width="6" height="28" rx="1" fill="var(--indigo)"/>
      <rect x="19" y="2" width="6" height="28" rx="1" fill="var(--indigo)"/>
      <rect x="7" y="7" width="6" height="6" fill="var(--coral)"/>
      <rect x="19" y="19" width="6" height="6" fill="var(--coral)"/>
    </svg>
    <span>ChitWeave</span>
  </a>
  <div class="tools">
    <button type="button" id="theme" class="chip" aria-live="polite"></button>
    <button type="button" id="lang" class="chip"></button>
    <a class="chip" id="source" href="https://github.com/Arthur031221/ChitWeave"></a>
  </div>
</header>

<main>
  <section class="intro">
    <h1 id="hero"></h1>
    <p id="sub"></p>
  </section>

  <div class="layout">
    <section class="stage">
      <div class="frame" id="frame">
        <div id="poster" class="poster"></div>
        <svg id="overlay" class="overlay" viewBox="0 0 1080 1350" aria-hidden="true">
          <path id="dim" class="dim" fill-rule="evenodd" d=""/>
          <rect id="band" class="band" x="0" y="0" width="0" height="0" rx="2"/>
        </svg>
        <button type="button" id="shuttle" class="shuttle" role="slider" tabindex="0" aria-orientation="vertical">
          <svg class="boat" viewBox="0 0 34 16" aria-hidden="true">
            <path d="M1 8C7 1 27 1 33 8 27 15 7 15 1 8Z" fill="var(--wood)"/>
            <path d="M8 8h18" stroke="var(--wood-line)" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="17" cy="8" r="2.4" fill="var(--wood-line)"/>
          </svg>
        </button>
        <span id="badge" class="badge" hidden></span>
      </div>
      <div class="readout">
        <button type="button" id="prev" class="step" aria-label="Previous day">&#8249;</button>
        <p id="readout" role="status" aria-live="polite"></p>
        <button type="button" id="next" class="step" aria-label="Next day">&#8250;</button>
      </div>
    </section>

    <section class="panel" id="controls">
      <div class="block source" id="drop">
        <div class="row">
          <button type="button" id="sample" class="btn"></button>
          <label class="btn primary" for="file" id="import-label"></label>
          <input type="file" id="file" accept=".txt,.chat,.json,text/plain,application/json" hidden>
        </div>
        <p class="hint" id="import-hint"></p>
        <p class="links"><a id="how" href="https://help.line.me/line/?contentId=20007388&amp;lang=zh-Hant" target="_blank" rel="noopener noreferrer"></a>
          <button type="button" id="json" class="linklike"></button></p>
        <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      </div>

      <fieldset class="block">
        <legend id="range-title"></legend>
        <div class="seg" id="range" role="radiogroup"></div>
        <label class="field inline"><span id="end-label"></span><input type="date" id="end"></label>
      </fieldset>

      <fieldset class="block">
        <legend id="colors-title"></legend>
        <div class="swatches" id="colors" role="radiogroup"></div>
      </fieldset>

      <fieldset class="block names">
        <legend id="names-title"></legend>
        <label class="field"><span id="title-label"></span><input type="text" id="title" maxlength="40" autocomplete="off"></label>
        <div class="pair">
          <label class="field"><span id="name-a-label"></span><input type="text" id="name-a" maxlength="16" autocomplete="off" placeholder="A"></label>
          <button type="button" id="swap" class="btn small"></button>
          <label class="field"><span id="name-b-label"></span><input type="text" id="name-b" maxlength="16" autocomplete="off" placeholder="B"></label>
        </div>
      </fieldset>

      <div class="save">
        <button type="button" id="save-png" class="btn primary wide"></button>
        <button type="button" id="save-svg" class="btn wide"></button>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <p id="privacy"></p>
  <p id="scope"></p>
</footer>
